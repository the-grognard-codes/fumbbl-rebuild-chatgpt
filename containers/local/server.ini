server.local=true
server.port=22227
server.base=http://127.0.0.1:22227
server.base.dir=htdocs
server.log.folder=/tmp/ffb-logs
server.log.file=/tmp/ffb-server.log
server.log.file.split=false
server.log.level=3
server.command.compression=false
server.spectator.cooldown=0
server.test=false
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://database:3306/ffb_local
db.type=mariadb
db.user=ffb_local
db.password.file=/run/secrets/db_password
admin.salt=local-fixture-only
admin.password.file=/run/secrets/admin_password
local.coach.password.file=/run/secrets/coach_password
local.browser.home.token.file=/run/secrets/browser_home_token
local.browser.away.token.file=/run/secrets/browser_away_token
# Local startup only: MOVEMENT, BOTH_DOWN, BOTH_DOWN_BLOCK,
# BOTH_DOWN_AWAY, BOTH_DOWN_AWAY_BLOCK. Restart server after changing.
local.browser.fixture=BOTH_DOWN
local.browser.control.file=/tmp/ffb-browser-control
backup.dir=/data/backup
backup.extension=gz
backup.salt=local-fixture-only
timer.networkEntropy=0
timer.sessionTimeoutEnabled=false
